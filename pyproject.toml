[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memscope"
version = "0.1.0"
description = "Placebo controls for agent memory systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
stats = ["numpy", "scipy"]

[project.scripts]
memscope = "memscope.__main__:main"

[tool.setuptools.packages.find]
include = ["memscope*"]
